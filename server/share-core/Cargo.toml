[package]
name = "share-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Shared logic for the verSHion pool: password hashing now, strip/hash/validation in phase 2."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
argon2 = { version = "0.6", default-features = false, features = ["alloc", "password-hash"] }
wasm-bindgen = "=0.2.128"
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
opt-level = "s"
lto = true
